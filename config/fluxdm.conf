# FluxDM — fluxdm.conf
# Main runtime configuration

[core]
ipc_socket      = /tmp/fluxdm-<user>.sock   # NOTE: nothing reads this file yet. The daemon takes the socket path from
                                             # daemon/src/main/resources/application.properties (fluxdm.core.socket-path)
log_level       = 1          # 0=quiet 1=info 2=debug

[network]
global_limit    = 0          # bytes/sec, 0 = unlimited
default_segments = 8
connect_timeout  = 10        # seconds
recv_timeout     = 30        # seconds

[storage]
download_dir    = ~/Downloads
part_dir        = ~/Downloads/.fluxpart

[daemon]
port            = 7171
host            = 127.0.0.1

# FluxDM — fluxdm.conf
# Main runtime configuration

[core]
ipc_socket      =                           # NOTE: nothing reads this file yet. Unset, the socket is
                                             # $XDG_RUNTIME_DIR/fluxdm/core.sock or ~/.fluxdm/run/core.sock; the daemon takes an
                                             # override from application.properties (fluxdm.core.socket-path)
log_level       = 1          # 0=quiet 1=info 2=debug

[network]
global_limit    = 0          # bytes/sec, 0 = unlimited
default_segments = 8
connect_timeout  = 10        # seconds
recv_timeout     = 30        # seconds

[storage]
download_dir    = ~/Downloads
part_dir        = ~/Downloads/.fluxpart

[daemon]
port            = 7171
host            = 127.0.0.1

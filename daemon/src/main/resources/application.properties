# FluxDM — application.properties
server.port=7171
server.address=127.0.0.1

spring.datasource.url=jdbc:sqlite:${user.home}/.fluxdm/fluxdm.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# Every database access happens inside one repository call, so nothing needs the
# EntityManager to stay open for the whole HTTP request.
spring.jpa.open-in-view=false
# SQLite allows one writer at a time. One pooled connection serialises access
# instead of letting parallel threads fail with "database is locked".
spring.datasource.hikari.maximum-pool-size=1

logging.level.root=INFO
logging.level.com.fluxdm=DEBUG

# ── C core process management ────────────────────────────────────────────────
# Path to the compiled fluxdm-core binary (see core/Makefile).
fluxdm.core.binary-path=${user.home}/Desktop/fluxdm/core/fluxdm-core
# Where the daemon and the core talk. Leave it unset: the socket then goes in a directory that only this
# user can enter ($XDG_RUNTIME_DIR/fluxdm when that is private, otherwise ~/.fluxdm/run), so no other
# account can put a socket in its place. The daemon passes the path to the core with --sock, so the two
# always agree. Set it only if you need the socket somewhere else.
#fluxdm.core.socket-path=
# Log level passed to fluxdm-core via --log (0=quiet 1=info 2=debug)
fluxdm.core.log-level=1
# How long to wait for the core to start listening after it is spawned
fluxdm.core.startup-timeout-ms=5000
# Global bandwidth cap passed via --limit (0=unlimited)
fluxdm.core.global-limit-bps=0
# Servers that answer HTTP 429 / 503 ("too many requests") are waited out, slowing down to
# what the server accepts. This is how long, in seconds, a download keeps waiting while the
# server serves none of its connections before it fails. While the server is feeding the
# download's other connections (or other downloads from the same host) nothing is lost by
# queueing behind its connection limit. 0 = fail at the first refusal.
# Passed via --patience (0 to 86400).
fluxdm.core.patience-seconds=300

# ── Local API protection ─────────────────────────────────────────────────────
# The API starts downloads and writes files, so every request has to show where it comes from:
#
#   Host    must be one of these names. A web page can make its own host name point at 127.0.0.1
#           ("DNS rebinding") and then talk to the API as if it were the page's own server; the
#           request still names the page's host. The port does not matter, the name does.
fluxdm.api.allowed-hosts=127.0.0.1,localhost,[::1]
#   Origin  when a request has one (every cross-site request from a browser does), it must be one of
#           these exact origins: the React dev server and the Electron app. Wildcards are refused.
fluxdm.api.allowed-origins=http://localhost:3000,app://-
#   Token   "Authorization: Bearer <token>" on every REST call and in the STOMP CONNECT frame. The token
#           is 256 random bits in a file only this user can read, created on first start. Clients on this
#           account read the file. To rotate the token, delete the file and restart.
#           false switches only this check off, for development: Host and Origin stay enforced.
fluxdm.api.auth.enabled=true
# Blank = ${user.home}/.fluxdm/api-token
fluxdm.api.token-file=

# ── Queue / concurrency ───────────────────────────────────────────────────────
# Downloads beyond this count wait in QueueService until a running one
# finishes (success or error) and frees a slot.
fluxdm.max-concurrent-downloads=4

# ── Recovery ─────────────────────────────────────────────────────────────────
# Downloads that were running when the daemon (or the core) stopped are started
# again when the connection to the core is next established and carry on from
# their .fluxpart checkpoint. Set to false to have them come back paused instead.
fluxdm.recovery.auto-resume=true
